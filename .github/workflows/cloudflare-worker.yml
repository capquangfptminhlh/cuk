name: Deploy CUKTECH Cloudflare API (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    if: vars.CLOUDFLARE_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Configure database binding
        env:
          D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          python3 - <<'PY'
          import os, re, pathlib
          value=os.environ.get('D1_DATABASE_ID','')
          assert re.fullmatch(r'[a-fA-F0-9-]{36}',value), 'Configure D1 database UUID'
          p=pathlib.Path('worker/wrangler.toml')
          p.write_text(p.read_text().replace('REPLACE_WITH_YOUR_D1_DATABASE_UUID',value))
          PY
      - name: Apply migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 d1 migrations apply cuktech-store --remote --config worker/wrangler.toml
      - name: Deploy API
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config worker/wrangler.toml
