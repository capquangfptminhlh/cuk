name: CUKTECH exhaustive image transport diagnosis
on:
  push:
    branches: [diagnose/cuktech-image-delivery-full]
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/verify-media-origin.js
      - scripts/browser-all-images-qa.js
      - .github/workflows/image-transport-audit.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install source image validation tools
        run: npm install --no-audit --no-fund
      - name: Verify all production image HTTP bytes and Sharp decoding
        run: node scripts/verify-media-origin.js
      - name: Upload all-image audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cuktech-image-transport-diagnosis
          path: qa-screenshots/media-origin-audit.json
          if-no-files-found: ignore
