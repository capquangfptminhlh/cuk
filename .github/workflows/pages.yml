name: Deploy CUKTECH frontend to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 */12 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-cuktech
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore manufacturer's image cache
        uses: actions/cache@v4
        with:
          path: .image-cache/cn
          key: cuktech-cn-media-${{ github.run_id }}
          restore-keys: |
            cuktech-cn-media-
      - name: Build website for cuktech.vn
        env:
          VITE_API_BASE_URL: https://api.cuktech.vn
        run: |
          npm install --no-audit --no-fund
          node scripts/build-catalog-preview.js
          node scripts/build-china-catalog.js
          node scripts/cache-china-media.js
          npm run build
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy static storefront
        id: deployment
        uses: actions/deploy-pages@v4
