name: Deploy CUKTECH.com catalog to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 */12 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-cuktech
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch full public cuktech.com catalog (products, photos, descriptions)
        run: |
          npm install --no-audit --no-fund
          node scripts/build-catalog-preview.js
          node scripts/enrich-global-models.js
      - name: Reuse verified CUKTECH photo conversions
        uses: actions/cache@v4
        with:
          path: .image-cache/shopify
          key: cuktech-shopify-webp-${{ github.sha }}
          restore-keys: |
            cuktech-shopify-webp-
      - name: Optimize original Shopify photos as local WebP files
        run: |
          node scripts/mirror-shopify-photos.js
      - name: Build website for cuktech.vn
        env:
          VITE_API_BASE_URL: https://api.cuktech.vn
        run: |
          npm run build
          node --input-type=module -e "import {readFileSync,existsSync} from 'node:fs';const d=JSON.parse(readFileSync('dist/catalog.snapshot.json'));if(d.mediaAudit?.coveredProducts!==d.sourceCount)throw Error('Missing product covers');for(const p of d.products){if(!p.image_url.startsWith('media/products/')||!existsSync('dist/'+p.image_url))throw Error('Image not present in static Pages artifact: '+p.name)}console.log('STATIC PHOTO QA PASS:',d.mediaAudit.coveredProducts,'product covers and',d.mediaAudit.cachedImages,'WebP files')"
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
          printf '{"commit":"%s"}\n' "$GITHUB_SHA" > dist/build.json
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    needs: build
    # Playwright 1.56 Chromium supports Ubuntu 24.04; ubuntu-latest moved to 26.04.
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy static storefront
        id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify live cuktech.vn and real product WebP responses
        run: node scripts/check-live-site.js
      - name: Install headless Chromium for real browser visual QA
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify desktop/mobile homepage and product images in Chromium
        run: node scripts/browser-photo-qa.js
      - name: Audit all 40 product detail pages and 274 real WebP images
        timeout-minutes: 15
        run: node scripts/browser-all-images-qa.js
      - name: Upload image QA screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cuktech-photo-browser-qa
          path: qa-screenshots/
          if-no-files-found: ignore
