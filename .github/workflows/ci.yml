name: CUKTECH VN CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate server syntax
        run: npm run check
      - name: Run catalog import tests
        run: npm test
      - name: Build storefront
        run: npm run build
      - name: Check generated output
        run: test -s dist/index.html
